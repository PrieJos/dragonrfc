version: "3"

tasks:
  sdk:check:
    internal: true
    desc: Fail unless the SDK directory (SAPNWRFC_HOME, else FALLBACK) has include/ and lib/
    preconditions:
      - sh: |
          dir="${SAPNWRFC_HOME:-{{.FALLBACK | default ""}}}"
          test -n "$dir" && test -d "$dir/include" && test -d "$dir/lib"
        msg: Set SAPNWRFC_HOME to the NW RFC SDK directory (it must contain include/ and lib/).

  setup:
    desc: Install dependencies and build the extension (needs SAPNWRFC_HOME)
    deps: [sdk:check]
    cmds:
      - uv sync --reinstall-package dragonrfc

  format:
    desc: Format the code
    cmds:
      - uv run ruff format .

  format:check:
    desc: Fail if any file needs formatting (CI)
    cmds:
      - uv run ruff format --check .

  lint:
    desc: Lint and auto-fix
    cmds:
      - uv run ruff check . --fix

  lint:check:
    desc: Lint without fixing (CI)
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Static type check (strict)
    cmds:
      - uv run mypy

  stubtest:
    desc: Check that the .pyi stubs match the compiled extension
    cmds:
      - uv run python -m mypy.stubtest dragonrfc --allowlist stubtest-allowlist.txt

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest

  test:sap:
    desc: Run integration tests against a real SAP system (needs SAPNWRFC_HOME)
    deps: [sdk:check]
    cmds:
      - uv run pytest -m sap

  build:
    desc: Build sdist and wheel (needs SAPNWRFC_HOME)
    deps: [sdk:check]
    cmds:
      - uv build

  wheels:
    desc: Build and test platform wheels with cibuildwheel (needs SAPNWRFC_HOME)
    deps:
      # CI stages the SDK as ./nwrfcsdk and sets SAPNWRFC_HOME only inside cibuildwheel.
      - task: sdk:check
        vars: {FALLBACK: nwrfcsdk}
    cmds:
      # Linux builds run in a container that only sees the project at /project,
      # so stage the SDK there (gitignored) as CI does. macOS builds on the host.
      - |
        [ "$(uname -s)" != Linux ] || test -d nwrfcsdk || cp -r "$SAPNWRFC_HOME" nwrfcsdk
        export CIBW_ENVIRONMENT_LINUX="${CIBW_ENVIRONMENT_LINUX:-SAPNWRFC_HOME=/project/nwrfcsdk LD_LIBRARY_PATH=/project/nwrfcsdk/lib}"
        uvx cibuildwheel==3.* --output-dir wheelhouse

  clean:
    desc: Remove build artifacts, generated C files and tool caches and the SDK copy staged by wheels (keeps .venv, .env)
    cmds:
      - |
        uv run python -c "
        import pathlib, shutil
        for pattern in (
            'build',
            'dist',
            'wheelhouse',
            'nwrfcsdk',
            '*.egg-info',
            'src/*.egg-info',
            '.pytest_cache',
            '.mypy_cache',
            '.ruff_cache',
            'htmlcov',
            '**/__pycache__',
        ):
            for path in pathlib.Path('.').glob(pattern):
                if '.venv' not in path.parts:
                    shutil.rmtree(path, ignore_errors=True)
        for pattern in (
            'src/dragonrfc/*.c',
            'src/dragonrfc/*.cpp',
            'src/dragonrfc/*.html',
            'src/dragonrfc/*.so',
            'src/dragonrfc/*.pyd',
            '.coverage',
            '**/dev_rfc.log',
        ):
            for path in pathlib.Path('.').glob(pattern):
                path.unlink()
        "

  check:
    desc: Everything CI runs
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: stubtest
      - task: test
